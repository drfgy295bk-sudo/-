
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crypto Clicker Ultimate</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-color: #1f2833;
            --accent-color: #66fcf1;
            --secondary-accent: #45f3ff;
            --turbo-color: #ff0055;
            --text-color: #ffffff;
            --text-secondary: #c5c6c7;
            --success-color: #00ff87;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 16px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
            width: 100%;
        }

        .rank-badge {
            display: inline-block;
            background: rgba(102, 252, 241, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .score-value {
            font-size: 44px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 20px rgba(102, 252, 241, 0.3);
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .stats-row span { color: var(--accent-color); font-weight: bold; }

        .click-area {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-grow: 1;
        }

        .coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1f2833 0%, #0b0c10 100%);
            box-shadow: 0 0 30px rgba(102, 252, 241, 0.2), inset 0 0 20px rgba(102, 252, 241, 0.2);
            border: 4px solid var(--accent-color);
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.05s ease, border-color 0.3s, box-shadow 0.3s;
            touch-action: manipulation;
        }

        .coin::before {
            content: attr(data-emoji);
            font-size: 85px;
            transition: transform 0.2s;
        }

        .coin:active { transform: scale(0.94); }
        .coin:active::before { transform: scale(0.9); }

        .coin.turbo-active {
            border-color: var(--turbo-color);
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.6), inset 0 0 20px rgba(255, 0, 85, 0.4);
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) scale(1); }
            50% { transform: translate(-1px, -1px) scale(1); }
            100% { transform: translate(1px, -1px) scale(1); }
        }

        .floating-text {
            position: absolute;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-color);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }
        .floating-text.turbo {
            color: var(--turbo-color);
            text-shadow: 0 0 15px var(--turbo-color);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1.2); }
            100% { opacity: 0; transform: translateY(-140px) scale(0.7); }
        }

        .action-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 12px;
        }

        .action-btn {
            flex: 1;
            background: var(--panel-color);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .action-btn#turbo-btn.active-now {
            background: var(--turbo-color);
            color: #fff;
            border-color: transparent;
        }

        .upgrade-container {
            background-color: var(--panel-color);
            border-radius: 20px;
            padding: 12px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .upgrade-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .upgrade-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .upgrade-cost {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-color);
            background: rgba(102, 252, 241, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
        }

        .upgrade-details { text-align: left; }
        .upgrade-name { font-size: 14px; font-weight: 600; }
        .upgrade-effect { font-size: 11px; color: var(--text-secondary); }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #1f2833;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 20px;
            width: 90%; max-width: 350px; text-align: center;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
            text-align: left;
        }
        .quest-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .quest-info h4 { font-size: 13px; margin-bottom: 2px; }
        .quest-info p { font-size: 11px; color: var(--success-color); font-weight: bold; }
        .quest-btn {
            background: var(--accent-color); border: none; color: #000;
            padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .quest-btn.claimed { background: transparent; color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.2); cursor: not-allowed; }

        .close-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 8px 16px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div id="rank-badge" class="rank-badge">Ранг: Новичок 🥚</div>
        <div class="score-value" id="score">0</div>
        <div class="stats-row">
            <div>Клик: <span id="click-stat">+1</span></div>
            <div>В сек: <span id="passive-stat">+0</span></div>
        </div>
    </div>

    <div class="click-area">
        <div class="coin" id="coin" data-emoji="🥚"></div>
    </div>

    <div class="action-row">
        <button class="action-btn" id="turbo-btn">
            <span>🚀 ТУРБО (x5)</span>
            <span id="turbo-timer" style="font-size: 10px; color: var(--text-secondary);">Готов</span>
        </button>
        <button class="action-btn" id="quests-menu-btn">
            <span>📋 ЗАДАНИЯ</span>
            <span id="quests-count" style="font-size: 10px; color: var(--success-color);">Доступны бонусы</span>
        </button>
    </div>

    <div class="upgrade-container">
        <button class="upgrade-btn" id="up-click-btn" disabled>
            <div class="upgrade-details">
                <span class="upgrade-name">⚡️ Мульти-клик</span>
                <span class="upgrade-effect" id="up-click-desc">Улучшить силу нажатия</span>
            </div>
            <div class="upgrade-cost" id="up-click-cost">50</div>
        </button>

        <button class="upgrade-btn" id="up-passive-btn" disabled>
            <div class="upgrade-details">
                <span class="upgrade-name">⛏ Авто-майнер</span>
                <span class="upgrade-effect" id="up-passive-desc">Добавить пассивный доход</span>
            </div>
